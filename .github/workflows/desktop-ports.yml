name: Linux and macOS packages
on:
  push:
    branches: [codex/linux-macos]
  workflow_dispatch:
    inputs:
      fixture_asset_id:
        description: Optional release asset ID for an authorized private QA fixture
        type: string
        default: ''
      runners:
        description: Optional JSON runner list for a targeted retry, e.g. ["ubuntu-22.04"]
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: desktop-ports-${{ github.ref }}${{ inputs.runners }}
  cancel-in-progress: false
jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners || '["ubuntu-22.04","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    # Access the user-authorized fixture stored in a temporary draft release.
    # No fixture, profile or save is cached or uploaded as an Actions artifact.
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: never
      NO_STRIP: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      QA_FIXTURE_ASSET: ${{ inputs.fixture_asset_id || vars.MEDNAFEN_QA_FIXTURE_ASSET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          # The Azure mirror can time out once per package; use Ubuntu's public mirror.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential pkg-config libsdl2-dev libflac-dev libasound2-dev zlib1g-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb dbus-x11 xauth
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 flac
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: .cache/unix-engine
          key: mednafen-1.32.1-${{ runner.os }}-${{ runner.arch }}-v2-${{ github.run_id }}
          restore-keys: mednafen-1.32.1-${{ runner.os }}-${{ runner.arch }}-v2-
      - name: Build native emulator and adapter
        run: python3 scripts/prepare_unix.py --jobs 3 > engine-build.log 2>&1
      - uses: actions/cache/save@v4
        if: always() && steps.engine-cache.outcome == 'success'
        with:
          path: .cache/unix-engine
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Frontend and Rust tests
        run: |
          npm ci
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build desktop package
        run: npm run desktop:build
      - name: Download temporary authorized test fixture
        if: env.QA_FIXTURE_ASSET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/fixtures
          [[ "$QA_FIXTURE_ASSET" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/octet-stream' "repos/${{ github.repository }}/releases/assets/$QA_FIXTURE_ASSET" > .cache/fixtures/qa-wswan.zip
          python3 -c "import zipfile; zipfile.ZipFile('.cache/fixtures/qa-wswan.zip').extractall('.cache/fixtures')"
      - name: Validate packaged application
        run: |
          if [ -n "$QA_FIXTURE_ASSET" ]; then
            python3 scripts/check_unix_packages.py
          else
            python3 scripts/check_unix_packages.py --skip-game-tests
          fi
      - name: Remove temporary fixture files
        if: always()
        run: rm -f .cache/fixtures/test.wsc .cache/fixtures/qa-wswan.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*
            .cache/unix-qa/*.json
            .cache/unix-qa/*.log
            engine-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
