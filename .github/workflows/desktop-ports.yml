name: Linux and macOS packages
on:
  push:
    branches: [codex/linux-macos]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ports-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    # Access the user-authorized fixture stored in a temporary draft release.
    # No fixture, profile or save is cached or uploaded as an Actions artifact.
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: never
      NO_STRIP: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsdl2-dev libflac-dev libasound2-dev zlib1g-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb dbus-x11 xauth
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 flac
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/cache@v4
        with:
          path: .cache/unix-engine
          key: mednafen-1.32.1-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build native emulator and adapter
        run: python3 scripts/prepare_unix.py --jobs 3 > engine-build.log 2>&1
      - name: Frontend and Rust tests
        run: |
          npm ci
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build desktop package
        run: npm run desktop:build
      - name: Download temporary authorized test fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/fixtures
          gh api -H 'Accept: application/octet-stream' repos/gametranslate/mednafen.github.io/releases/assets/736017926 > .cache/fixtures/qa-wswan.zip
          python3 -c "import zipfile; zipfile.ZipFile('.cache/fixtures/qa-wswan.zip').extractall('.cache/fixtures')"
      - name: Test packaged application
        run: python3 scripts/check_unix_packages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*
            .cache/unix-qa/*.json
            .cache/unix-qa/*.log
            engine-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
